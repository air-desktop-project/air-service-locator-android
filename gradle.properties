# Un daemon Gradle qui manque de mémoire meurt au milieu d'une construction, et
# le message qu'il laisse ne désigne jamais sa cause.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX, et rien d'autre. Les bibliothèques de support d'avant 2018 ne sont
# plus maintenues ; laisser la porte ouverte les ferait entrer par une
# dépendance transitive.
android.useAndroidX=true

# LA COMPILATION PARALLÈLE ET LE CACHE SONT DÉLIBÉRÉMENT ABSENTS ICI.
#
# Ils accélèrent, et ils rendent aussi les échecs plus difficiles à lire — une
# tâche servie par le cache n'a pas tourné, et le dire après coup demande de
# fouiller. Le projet est minuscule ; le gain serait nul et le coût réel.
# À reconsidérer quand la construction dépassera la minute.
